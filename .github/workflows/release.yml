name: Release Creation

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version/tag to create (e.g. 0.0.6)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release: # zizmor: ignore[anonymous-definition]
    if: github.ref == 'refs/heads/main'
    environment: release
    permissions:
      id-token: write  # for AWS Secrets Manager via OIDC
      contents: write  # for softprops/action-gh-release to create GitHub release
    runs-on: cx-public-ubuntu-x64
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Configure AWS Credentials for Secrets Manager
        uses: step-security/configure-aws-credentials@1448016543d4432bd608e0de7871c7bf9e9be925 # v6.2.1
        with:
          role-to-assume: ${{ secrets.SECRET_MANAGER_ROLE_ARN }}
          aws-region: ${{ secrets.SECRET_MANAGER_AWS_REGION }}
          role-session-name: release-secrets-fetch

      - name: Fetch secrets from AWS Secrets Manager
        uses: step-security/aws-secretsmanager-get-secrets@102b6b2a2528747bcc321bb99ef326d8be7ef58f # v3.0.1
        with:
          secret-ids: |
            ,${{ secrets.SECRET_MANAGER_SECRET_NAME }}
            MAVEN_GPG_PRIVATE_KEY,checkmarx/ast-cli-java-wrapper/maven-gpg-private-key
          parse-json-secrets: true

      - name: Set release version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$INPUT_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be a plain version like 1.2.3 (got: '$INPUT_TAG')"
            exit 1
          fi
          echo "RELEASE_VERSION=${INPUT_TAG}" >> "$GITHUB_ENV"

      - name: Set up Maven Central Repository
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '11'
          distribution: 'adopt'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ env.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Configure echo mirror for dependency resolution
        run: |
          sed -i 's|</servers>|<server><id>echo-repo</id><username></username><password>'"$ECHO_LIBRARIES_ACCESS_KEY"'</password></server></servers>|' ~/.m2/settings.xml
          sed -i 's|</settings>|<mirrors><mirror><id>echo-repo</id><mirrorOf>*</mirrorOf><url>https://maven.echohq.com</url></mirror></mirrors></settings>|' ~/.m2/settings.xml
        env:
          ECHO_LIBRARIES_ACCESS_KEY: ${{ secrets.ECHO_LIBRARIES_ACCESS_KEY }}

      - name: Pin Maven to 3.9.16
        # Maven 3.10+ breaks central-publishing-maven-plugin bundling (upstream bug)
        run: |
          MAVEN_VERSION=3.9.16
          # Resolved through the echo-repo mirror configured in ~/.m2/settings.xml above
          mvn -B -q dependency:copy -Dartifact=org.apache.maven:apache-maven:${MAVEN_VERSION}:tar.gz:bin -DoutputDirectory=/tmp/maven-dist
          sudo tar -xzf /tmp/maven-dist/apache-maven-${MAVEN_VERSION}-bin.tar.gz -C /opt
          echo "/opt/apache-maven-${MAVEN_VERSION}/bin" >> $GITHUB_PATH

      - name: Update the POM version
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: mvn -B versions:set -DnewVersion="${VERSION}" --file pom.xml -DskipTests

      - name: Publish package
        run: mvn --batch-mode deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ env.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ env.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ env.MAVEN_GPG_PASSPHRASE }}

      - name: Create Release
        uses: step-security/action-gh-release@277bfa82abcfdb73e5bbb19e213fd76532ee2be5 # v3.0.0
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_VERSION }}
          generate_release_notes: true